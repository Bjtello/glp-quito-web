<div class="min-h-screen bg-slate-50 py-16 md:py-24 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-md border border-slate-100 text-slate-800">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">
                Crea tu <span class="text-green-600">Cuenta</span>
            </h2>
            <p class="text-sm text-slate-500">Regístrate para agendar nuestro servicio</p>
        </div>

        <form (ngSubmit)="registrarCliente()">
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Correo Electrónico</label>
                <input type="email" name="correo" [(ngModel)]="nuevoCorreo" required
                    class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all bg-slate-50/50 text-slate-800"
                    placeholder="ejemplo@correo.com">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña</label>
                <input type="password" name="password" [(ngModel)]="nuevaPassword" required minlength="6"
                    class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all bg-slate-50/50 text-slate-800"
                    placeholder="Mínimo 6 caracteres">
            </div>

            <div *ngIf="errorMsj" class="mb-4 text-red-500 text-sm font-bold text-center">
                {{ errorMsj }}
            </div>

            <button type="submit" [disabled]="cargando"
                class="w-full bg-green-600 hover:bg-green-700 disabled:bg-green-300 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5 text-lg cursor-pointer mb-6">
                {{ cargando ? 'Registrando...' : 'Registrarme' }}
            </button>

            <div class="text-center text-sm font-medium text-slate-600">
                ¿Ya tienes cuenta?
                <a routerLink="/login" class="text-green-600 hover:text-green-700 ml-1 transition-colors">
                    Inicia Sesión aquí
                </a>
            </div>
        </form>
    </div>
</div>
