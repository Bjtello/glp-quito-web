<div class="min-h-screen bg-slate-50 py-16 md:py-24">
    <div class="max-w-4xl mx-auto px-4">

        <div class="mb-12">
            <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">
                Panel de <span class="text-green-600">Control</span>
            </h2>
            <p class="text-slate-500 mt-2">Área exclusiva para administradores del sistema.</p>
        </div>

        <!-- Contenedor del Formulario -->
        <div class="bg-white rounded-3xl p-8 md:p-10 shadow-md border border-slate-100 text-slate-800">
            <h3 class="text-2xl font-bold mb-6 text-slate-900 border-b border-slate-100 pb-4">
                👤 Registrar Nuevo Usuario
            </h3>

            <form (ngSubmit)="crearUsuario()" #adminForm="ngForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

                    <!-- Correo -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Correo Electrónico</label>
                        <input type="email" name="correo" [(ngModel)]="nuevoCorreo" required
                            class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all bg-slate-50/50 text-slate-800"
                            placeholder="ejemplo@correo.com">
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña Segura</label>
                        <input type="password" name="password" [(ngModel)]="nuevaPassword" required minlength="6"
                            class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all bg-slate-50/50 text-slate-800"
                            placeholder="Minimo 6 caracteres">
                    </div>

                    <!-- Rol -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Asignar Rol</label>
                        <div class="flex space-x-4">
                            <label
                                class="flex items-center space-x-2 cursor-pointer bg-slate-50 px-4 py-3 border border-slate-200 rounded-xl hover:bg-slate-100 transition-colors">
                                <input type="radio" name="rol" value="usuario" [(ngModel)]="nuevoRol"
                                    class="text-green-500 focus:ring-green-500 border-slate-300">
                                <span class="font-medium text-slate-700">Usuario (Cliente)</span>
                            </label>

                            <label
                                class="flex items-center space-x-2 cursor-pointer bg-slate-50 px-4 py-3 border border-slate-200 rounded-xl hover:bg-slate-100 transition-colors">
                                <input type="radio" name="rol" value="admin" [(ngModel)]="nuevoRol"
                                    class="text-green-500 focus:ring-green-500 border-slate-300">
                                <span class="font-medium text-slate-700">Administrador</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div *ngIf="errorMsj" class="mb-4 text-red-500 text-sm font-bold">
                    {{ errorMsj }}
                </div>
                <div *ngIf="exitoMsj" class="mb-4 text-green-500 text-sm font-bold">
                    {{ exitoMsj }}
                </div>

                <button type="submit" [disabled]="cargando"
                    class="w-full md:w-auto bg-green-600 hover:bg-green-700 disabled:bg-green-300 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5 text-lg cursor-pointer">
                    {{ cargando ? 'Registrando...' : 'Registrar en el Sistema' }}
                </button>
            </form>
        </div>
    </div>
</div>
