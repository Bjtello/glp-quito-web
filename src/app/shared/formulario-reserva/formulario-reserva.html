<!-- Formulario Principal -->
<div class="bg-white rounded-2xl p-8 shadow-xl text-slate-800">
  <!-- Título dinámico -->
  <h3 class="text-2xl font-bold mb-6 text-slate-900">
    {{ editando ? 'Editar Agendamiento' : 'Agendar Instalación' }}
  </h3>
  
  <form (ngSubmit)="registrarCliente()" #formReserva="ngForm">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Nombre completo</label>
        <input type="text" name="nombre" [(ngModel)]="nuevoCliente.nombre" required
               class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
      </div>

      <!-- Teléfono -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Teléfono</label>
        <input type="text" name="telefono" [(ngModel)]="nuevoCliente.telefono"
               class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
      </div>

      <!-- Placa -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Placa del Vehículo</label>
        <input type="text" name="placaVehiculo" [(ngModel)]="nuevoCliente.placaVehiculo" required
               class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
               placeholder="Ej: PCQ-1234">
      </div>

      <!-- Tipo de Servicio -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Tipo de Servicio</label>
        <select name="tipoServicio" [(ngModel)]="nuevoCliente.tipoServicio"
                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
          <option value="" disabled selected>Seleccione un servicio</option>
          <option value="Instalación 5ta Generación">Instalación 5ta Generación</option>
          <option value="Mantenimiento Preventivo">Mantenimiento Preventivo</option>
          <option value="Reparación de Sistemas">Reparación de Sistemas</option>
        </select>
      </div>
    </div>

    <!-- Botones Dinámicos -->
    <div class="flex gap-4">
      <button type="submit" 
              class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
        {{ editando ? 'Actualizar Agendamiento' : 'Registrar Agendamiento' }}
      </button>
      
      <!-- Este botón solo aparece si estamos editando -->
      <button *ngIf="editando" type="button" (click)="limpiarFormulario()"
              class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-6 rounded-lg transition-colors">
        Cancelar Edición
      </button>
    </div>
  </form>
</div>

<!-- Sección Usuarios a la Cola (Tabla) -->
<div class="mt-12 bg-slate-900 rounded-2xl p-8 border border-slate-800 shadow-xl">
  <h3 class="text-2xl font-bold mb-6 text-white border-b border-slate-700 pb-4">Usuarios a la cola</h3>
  
  <div class="overflow-x-auto">
    <table class="w-full text-left text-slate-300">
      <thead class="bg-slate-800 text-slate-400">
        <tr>
          <th class="px-4 py-3 rounded-tl-lg">Nombre</th>
          <th class="px-4 py-3">Teléfono</th>
          <th class="px-4 py-3">Placa</th>
          <th class="px-4 py-3">Servicio</th>
          <th class="px-4 py-3 rounded-tr-lg text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Iteramos usando el Signal: listaClientes() -->
        <tr *ngFor="let cliente of listaClientes()" class="border-b border-slate-800 hover:bg-slate-800/50 transition-colors">
          <td class="px-4 py-4 font-medium text-white">{{ cliente.nombre | titlecase}}</td>
          <td class="px-4 py-4">{{ cliente.telefono }}</td>
          <td class="px-4 py-4">
            <span class="bg-slate-700 px-3 py-1 rounded text-sm font-bold text-emerald-400 tracking-wider">
              {{ cliente.placaVehiculo }}
            </span>
          </td>
          <td class="px-4 py-4">{{ cliente.tipoServicio }}</td>
          <td class="px-4 py-4 text-center">
            <button (click)="editarCliente(cliente)" class="text-blue-400 hover:text-blue-300 font-medium mr-4 transition-colors">
              Editar
            </button>
            <button (click)="eliminarCliente(cliente.id)" class="text-red-500 hover:text-red-400 font-medium transition-colors">
              Eliminar
            </button>
          </td>
        </tr>
        
        <!-- Mensaje si no hay clientes -->
        <tr *ngIf="listaClientes().length === 0">
          <td colspan="5" class="px-4 py-8 text-center text-slate-500">
            No hay vehículos en la cola en este momento.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
