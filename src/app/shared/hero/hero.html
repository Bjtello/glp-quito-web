<div class="bg-slate-900 py-20 relative overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 relative flex items-center">
    
    <!-- Contenedor de los 4 botones (Puntos verdes) a la izquierda -->
    <div class="absolute left-0 flex flex-col space-y-4 ml-2 md:ml-0 z-10">
      <!-- El *ngFor dibuja un botón por cada imagen. El [ngClass] hace brillar al seleccionado -->
      <button *ngFor="let img of imagenes; let i = index" 
              (click)="cambiarImagen(i)"
              [ngClass]="{'bg-emerald-400 scale-125': imagenActual === i, 'bg-emerald-900 hover:bg-emerald-600': imagenActual !== i}"
              class="w-4 h-4 rounded-full transition-all duration-300 shadow-lg cursor-pointer">
      </button>
    </div>

    <!-- Contenido Principal -->
    <div class="pl-10 md:pl-16 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center w-full">
      
      <!-- Lado Izquierdo: Textos -->
      <div>
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6 leading-tight">
          Instalación de Gas GLP para todo tipo de autos
        </h1>
        <p class="text-slate-300 text-lg mb-8">
          Ahorro de gasolina al 98%. Sistema de GLP AEB Lovato seguro, económico y eficiente. Servicio técnico especializado en el Sur de Quito, La Nueva Aurora.
        </p>
        <!-- Botón de WhatsApp con redirección -->
        <a href="https://wa.me/593992339000?text=Hola,%20vi%20su%20página%20web%20y%20deseo%20cotizar%20una%20instalación%20de%20GLP%20para%20mi%20vehículo." 
            target="_blank" 
            rel="noopener noreferrer"
            class="inline-block bg-slate-800 text-white font-bold py-3 px-6 rounded-lg border border-slate-700 hover:bg-slate-700 hover:border-slate-500 transition-all shadow-md text-center">
            Cotizar por WhatsApp
        </a>
      </div>
 
      <!-- Lado Derecho: Imagen Dinámica -->
      <div class="flex justify-center lg:justify-end">
        
        <img [src]="imagenes[imagenActual]" 
             alt="Instalación GLP Quito" 
             class="rounded-2xl shadow-2xl w-full max-w-lg h-[350px] object-cover border border-slate-700 transition-opacity duration-500">
             
      </div>
      
    </div>
  </div>
</div>
